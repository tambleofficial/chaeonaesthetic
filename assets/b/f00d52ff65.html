<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-mx="subhero" data-screen-label="Sub Hero" style="position:relative;min-height:min(78svh,760px);background:#FFFBF7;overflow:hidden;display:flex;align-items:center;border-bottom:1px solid #ECE2D9">
  <span aria-hidden="true" style="position:absolute;right:-3vw;top:50%;transform:translateY(-46%);font-size:clamp(320px,52vw,780px);font-weight:700;line-height:0.9;color:#34251E;opacity:0.08;pointer-events:none">{{ hanja }}</span>
  
  <div style="position:relative;width:100%;max-width:1400px;margin:0 auto;padding:clamp(130px,17vh,170px) clamp(20px,4vw,56px) clamp(72px,10vh,110px);display:flex;flex-direction:column;gap:clamp(22px,2.6vw,30px)">
    <div data-reveal="text" style="display:flex;align-items:center;gap:14px;font-size:11px;font-weight:700;letter-spacing:0.26em;color:#34251E">
      <a href="index.html" style="color:#34251E">HOME</a><span style="width:18px;height:1px;background:#ECE2D9"></span><span style="color:#34251E">{{ en }}</span>
    </div>
    <div data-reveal="text" style="display:flex;align-items:flex-end;gap:clamp(16px,2vw,28px)"><span style="font-size:clamp(64px,8vw,120px);line-height:0.85;font-weight:600;letter-spacing:-0.04em;color:#F37021">{{ no }}</span><span style="display:flex;flex-direction:column;gap:6px;padding-bottom:6px"><span style="font-size:clamp(14px,1.2vw,16px);font-weight:600;letter-spacing:0.24em;color:#34251E">{{ en }}</span><span style="font-size:clamp(20px,1.8vw,26px);font-weight:600;color:#34251E">{{ ko }}</span></span></div>
    <h1 style="margin:0;display:flex;flex-direction:column;font-size:clamp(44px,5.6vw,80px);font-weight:600;line-height:1.2;letter-spacing:-0.045em;color:#34251E">
      <span data-reveal="text">{{ line1 }}</span>
      <span data-reveal="text">{{ line2 }}</span>
    </h1>
    <span data-reveal="line" style="display:block;width:64px;height:1px;background:#F37021"></span>
    <p data-reveal="text" style="margin:0;max-width:34em;font-size:clamp(15px,1.2vw,17px);line-height:1.9;color:#34251E">{{ desc }}<br>{{ desc2 }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BRAND&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ko&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;브랜드 소개&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hanja&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;溫&quot;,&quot;穩&quot;],&quot;default&quot;:&quot;溫&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;따뜻하고,&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;편안하게.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;溫 따뜻하다, 온도가 알맞다 · 穩 평온하다, 편안하다&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      no: p.no ?? '01', en: p.en ?? 'BRAND', ko: p.ko ?? '브랜드 소개', hanja: p.hanja ?? '溫', tabs: ['01','02','03','04','05'].map((n, i) => ({ no: n, top: (16 + i * 58) + 'px', bg: n === (p.no ?? '01') ? '#F37021' : '#FFFBF7', color: n === (p.no ?? '01') ? '#FFFFFF' : '#74675E' })),
      line1: p.line1 ?? '따뜻하고,', line2: p.line2 ?? '편안하게.',
      desc: p.desc ?? '溫 따뜻하다, 온도가 알맞다 · 穩 평온하다, 편안하다', desc2: p.desc2 ?? ''
    };
  }
}
</script>
</body>
</html>
