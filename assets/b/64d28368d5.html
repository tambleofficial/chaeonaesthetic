<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Signature Care" style="background:#FAF6F2;padding-bottom:clamp(110px,12vw,160px)">
  <div style="position:relative;overflow:hidden;padding:clamp(76px,12vw,170px) 0;background:radial-gradient(60% 80% at 88% 10%, rgba(243,112,33,0.55) 0%, rgba(243,112,33,0) 60%), radial-gradient(50% 70% at 10% 100%, rgba(201,92,30,0.35) 0%, rgba(201,92,30,0) 60%), #2A1D17">
    <div style="position:relative;max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:28px">
      <span data-reveal="text" style="font-size:12px;font-weight:700;letter-spacing:0.24em;color:#F7B48A">채온의 기준 · SIGNATURE CARE</span>
      <h2 data-reveal="text" style="margin:0;font-size:clamp(36px,4.4vw,60px);line-height:1.3;font-weight:700;letter-spacing:-0.04em;color:#FFFFFF">채온<br>본체인지 케어</h2>
      <p data-reveal="text" style="margin:0;max-width:40em;font-size:clamp(16px,1.3vw,18px);line-height:1.95;font-weight:500;color:#F1E6DE">겉으로 드러난 고민을 넘어, 몸의 균형과 컨디션을 함께 살피는 관리. AI 3D 바디 분석으로 체형·자세 패턴을 확인하고, 개인의 컨디션과 고민에 맞춘 설계 위에 경락·롤링·도수 테크닉을 조화롭게 결합합니다.</p>
      <span style="display:block;width:min(260px,60%);height:1px;margin-top:20px;background:rgba(255,255,255,0.35)"></span>
      <div data-reveal="text" style="display:flex;align-items:flex-end;gap:16px"><span style="font-size:clamp(64px,6.4vw,88px);line-height:0.85;font-weight:700;letter-spacing:-0.04em;color:#FFFFFF">20</span><span style="display:flex;flex-direction:column;gap:4px;padding-bottom:4px"><span style="font-size:13px;font-weight:600;letter-spacing:0.16em;color:#F7B48A">YEARS</span><span style="font-size:14px;font-weight:500;color:#F1E6DE">현장 경험과 전문 테크닉</span></span></div>
    </div>
  </div>

  <div style="max-width:1320px;margin:clamp(72px,12vw,160px) auto 0;padding:0 clamp(20px,4vw,56px);display:flex;flex-direction:column;align-items:center;gap:clamp(32px,4vw,48px)">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.28em;color:#F37021">AI BODY SCANNER</span>
      <h3 data-reveal="text" style="margin:0;font-size:clamp(24px,2.4vw,34px);line-height:1.35;font-weight:600;letter-spacing:-0.03em;color:#34251E">모티피지오 AI 바디스캐너 분석</h3>
      <span style="font-size:15px;line-height:1.7;color:#5E534B">실제 상담에 사용하는 분석 결과지입니다.</span>
    </div>
    <div style="width:100%;display:grid;grid-template-columns:{{ sliderCols }};grid-template-areas:{{ sliderAreas }};gap:clamp(12px,2vw,28px);align-items:center;justify-items:center">
      <button type="button" onClick="{{ prev }}" aria-label="이전" style="grid-area:prev;width:52px;height:52px;border:1px solid #CDBBAA;background:#FFFFFF;border-radius:50%;font-size:16px;color:#34251E;cursor:pointer;transition:border-color .3s,color .3s" style-hover="border-color:#F37021;color:#F37021">←</button>
      <div style="grid-area:img;position:relative;width:100%;max-width:900px;justify-self:center;aspect-ratio:1533/1040;background:#FFFFFF;border-radius:2px;overflow:hidden">
        <sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
          <img src="{{ s.src }}" alt="{{ s.cap }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s ease;opacity:{{ s.o }}">
        </sc-for>
      </div>
      <button type="button" onClick="{{ next }}" aria-label="다음" style="grid-area:next;width:52px;height:52px;border:1px solid #CDBBAA;background:#FFFFFF;border-radius:50%;font-size:16px;color:#34251E;cursor:pointer;transition:border-color .3s,color .3s" style-hover="border-color:#F37021;color:#F37021">→</button>
    </div>
    <div style="display:flex;align-items:center;gap:16px;font-size:15px;color:#34251E"><span style="color:#F37021;font-weight:600">{{ posCur }}</span><span style="width:32px;height:1px;background:#CDBBAA"></span><span>{{ cap }}</span></div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SLIDES = [
  { src: 'assets/photos/scan-report-hd.jpg', cap: '체형 분석 리포트' },
  { src: 'assets/photos/moti1-hd.jpg', cap: '3D 자세 · 정렬 결과지' },
  { src: 'assets/photos/moti2-hd.jpg', cap: '부위별 위험 순위 결과지' }
];
class Component extends DCLogic {
  state = { i: 0, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const i = this.state.i, n = SLIDES.length;
    const mob = this.state.w < 700;
    return {
      sliderCols: mob ? 'minmax(0,1fr) minmax(0,1fr)' : '52px minmax(0,1fr) 52px',
      sliderAreas: mob ? '"img img" "prev next"' : '"prev img next"',
      slides: SLIDES.map((s, k) => ({ ...s, o: k === i ? 1 : 0 })),
      posCur: '0' + (i + 1) + ' / 0' + n, cap: SLIDES[i].cap,
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n })
    };
  }
}
</script>
</body>
</html>
